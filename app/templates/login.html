<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Guido · Acceso Administrativo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="oasis-card">
        <div class="login-header">
            <h2 class="subtitle">Administrar el Taller</h2>
            <h1 class="title">Daniel Guido</h1>
        </div>

        

        <form method="post" action="{{ url_for('auth.login') }}" class="login-form">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required autofocus>
                <label for="username">Usuario</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required>
                <i id="togglePassword" class="fa-solid fa-eye"></i>
                <label for="password">Contraseña</label>
            </div>

            <div class="forgot-password">
                <a href="{{ url_for('routes.recuperar_Contra') }}">¿Olvidaste tus credenciales?</a>
            </div>

            <button type="submit" class="btn-login">
                Entrar al Taller
            </button>
        </form>

        <div class="oasis-footer">
            Costa Rica · Escultura Fina
        </div>
    </div>

  <script  src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
