<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña · Daniel Guido Escultor</title>
    <!-- Fuentes artísticas -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperarContrasena.css') }}">
</head>
<body>
    <main class="artist-card">
        <!-- Sello del artista -->
        <div class="artist-seal">
            <div class="seal-icon">
                <i class="fas fa-sculpture"></i>
            </div>
            <h1>DANIEL GUIDO</h1>
            <div class="subtitle">ESCULTOR COSTARRICENSE</div>
        </div>

        <div class="recovery-header">
            <h2>RECUPERAR ACCESO</h2>
            <div class="lead">
                <i class="fas fa-envelope"></i>
                Enviaremos un código a tu correo para restablecer tu contraseña
            </div>
        </div>

        <form id="recoveryForm">
            <div class="form-group">
                <label for="usuario" class="form-label">
                    <i class="fas fa-envelope"></i>
                    Correo Electrónico
                </label>
                <input type="email" 
                       id="usuario" 
                       name="usuario" 
                       class="form-input" 
                       placeholder="daniel@guido.art" 
                       required>
                <div class="error-message" id="emailError"></div>
            </div>

            <button type="button" class="btn-continuar" id="procesarBtn">
                CONTINUAR
            </button>
        </form>

        <div class="footer-links">
            <a href="/login" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Volver al inicio de sesión
            </a>
        </div>

        <!-- pie decorativo -->
        <div class="artist-footer">
            <i class="fas fa-tree"></i>
            <span>✦</span> TALLA DIRECTA <span>✦</span>
            <i class="fas fa-feather"></i>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/recuperarContrasena.js') }}"></script>
</body>
</html>
